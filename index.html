<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YUNUEN — Creative Portfolio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01182d}</style></head><body><div id="p3-cinematic">
  <style>
    #p3-cinematic{--ink:#01182d;--cyan:#00cffa;--ice:#d9fbff;position:relative;width:100%;font-family:Arial,Helvetica,sans-serif;color:white;color-scheme:dark;isolation:isolate}
    #p3-cinematic *{box-sizing:border-box}
    #p3-cinematic button,#p3-cinematic input{font:inherit}
    #p3-cinematic button{color:inherit;border:0}
    #p3-cinematic .stage{height:100vh;height:100dvh;position:relative;overflow:hidden;background:linear-gradient(145deg,#00cffa,#0263ac 55%,#01182d);isolation:isolate;--mx:0px;--my:0px}
    #p3-cinematic .water,#p3-cinematic .particles,#p3-cinematic .flood{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #p3-cinematic .water{filter:blur(2px);transform:scale(1.015);mix-blend-mode:screen;opacity:.46}
    #p3-cinematic .backdrop{position:absolute;inset:-3%;opacity:.44;pointer-events:none;overflow:hidden;filter:hue-rotate(10deg) saturate(1.2)}
    #p3-cinematic .bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;will-change:opacity,transform;transition:none}
    #p3-cinematic .bg-layer:last-child{opacity:0}
    #p3-cinematic .atmosphere{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#01182dda,transparent 36%),radial-gradient(ellipse at 75% 8%,#b6faff33,transparent 57%)}
    #p3-cinematic .scan{position:absolute;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0 3px,#001829 4px)}
    #p3-cinematic .stripe{position:absolute;inset:-20%;background:#fff;clip-path:polygon(1% 54%,3% 37%,98% 83%,100% 100%);opacity:.96;transform:translate(calc(var(--mx) * -.3),calc(var(--my) * -.3));pointer-events:none}
    #p3-cinematic .ghost{position:absolute;left:1%;top:85px;writing-mode:vertical-rl;font-weight:900;font-style:italic;font-size:100px;line-height:.8;letter-spacing:-8px;opacity:.16;user-select:none;pointer-events:none}
    #p3-cinematic .chrome{position:absolute;top:25px;left:28px;right:28px;z-index:8;display:flex;align-items:start;justify-content:space-between;pointer-events:none}
    #p3-cinematic .brand{font-family:Montserrat,'Arial Black',sans-serif;font-size:38px;letter-spacing:-.05em;font-style:italic;font-weight:950;line-height:.85;transform:rotate(-5deg);text-shadow:-3px 3px 0 #01182d}
    #p3-cinematic .brand small{display:block;font-size:11px;letter-spacing:4px;margin-top:11px;font-style:normal;font-weight:700}
    #p3-cinematic .archive{text-align:right;font-size:11px;letter-spacing:3px;line-height:1.7;color:#d8fbff;background:#01182dbd;padding:7px 11px}
    #p3-cinematic .archive strong{display:block;font-size:15px;color:white;letter-spacing:2px}
    #p3-cinematic .view{position:absolute;inset:0;z-index:3}
    #p3-cinematic .character-plane{position:absolute;left:-6%;bottom:-11%;width:min(65vw,78vh);width:min(65vw,78dvh);max-width:none;transform:translate(calc(var(--mx) * .6),calc(var(--my) * .6));pointer-events:none}
    #p3-cinematic .character-idle{position:relative;width:100%;aspect-ratio:var(--character-ratio, .837);transform-origin:45% 65%;animation:p3c-idle 7.2s ease-in-out infinite alternate;filter:drop-shadow(12px 14px 0 #001b4244)}
    #p3-cinematic .character-rig{--character-ratio:.769153;will-change:transform}
    #p3-cinematic .character-sprite{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background-repeat:no-repeat;background-size:200% 100%;background-position:0% 0%;transition:none!important;animation:none!important;transform:none!important}
    #p3-cinematic .character-sprite.closed{background-position:100% 0%}
    #p3-cinematic .bleed{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.25}
    #p3-cinematic .menu{position:absolute;left:44%;top:34%;width:53%;--option-height:clamp(48px,10vh,92px);transform:translate(calc(var(--mx) * -1),calc(var(--my) * -1));isolation:isolate}
    #p3-cinematic .option{position:relative;display:flex;align-items:center;height:var(--option-height);width:100%;padding:0 12px 0 26px;text-align:left;background:transparent;transform-origin:50% 50%;transform:translateX(var(--shift)) rotate(var(--angle));white-space:nowrap;z-index:2}
    #p3-cinematic .word{display:block;font-family:'Arial Black',Arial,Helvetica,sans-serif;font-weight:1000;font-style:italic;font-size:clamp(28px,min(5.3vw,8.3vh),82px);letter-spacing:-3.8px;line-height:1.1;text-transform:uppercase;color:#00d8ff;text-shadow:4px 5px 0 #012541;transform:scaleY(1.18) skewX(-6deg);transition:transform .3s cubic-bezier(.16,1,.3,1)}
    #p3-cinematic .cut{position:absolute;inset:0;display:flex;align-items:center;padding-left:26px;clip-path:polygon(0% 100%,10% 0%,100% 56%);opacity:0;pointer-events:none}
    #p3-cinematic .cut .word{color:#00162e;text-shadow:none}
    #p3-cinematic .option.active .cut{opacity:1}
    #p3-cinematic .option.active .word{transform:scaleY(1.18) skewX(-6deg) translateX(3px)}
    #p3-cinematic .selector{position:absolute;top:0;left:0;width:100%;height:var(--option-height);z-index:1;pointer-events:none;filter:drop-shadow(7px 13px 0 #001225);transform:translate(0,0) rotate(-11deg);transition:transform .32s cubic-bezier(.16,1,.3,1)}
    #p3-cinematic .selector:before{content:'';position:absolute;inset:0;background:#fff;clip-path:polygon(0% 100%,10% 0%,100% 56%)}
    #p3-cinematic .menu-kicker{position:absolute;top:-48px;left:36px;font-size:11px;letter-spacing:5px;color:#e6fcff;transform:rotate(-11deg)}
    #p3-cinematic .menu-note{position:absolute;left:48%;top:calc(34% + clamp(48px,10vh,92px) * 4 + 26px);bottom:auto;font-size:12px;letter-spacing:1px;max-width:45%;color:#c7f8ff;line-height:1.6;background:#00182de6;padding:7px 12px}
    #p3-cinematic .menu-note strong{color:white;font-weight:700}
    #p3-cinematic .bottom{position:absolute;bottom:24px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:8;font-size:11px;letter-spacing:1.3px;color:#e6fcff}
    #p3-cinematic .controls{display:flex;flex-wrap:wrap;gap:14px;background:#01182de6;padding:8px 10px}
    #p3-cinematic kbd{font-family:inherit;border:1px solid #adf4ff70;padding:3px 6px;line-height:1.9;margin-right:4px}
    #p3-cinematic .motion{min-height:40px;background:#01182d91;padding:9px 12px;letter-spacing:1px;font-size:11px}
    #p3-cinematic .flood{z-index:30;display:none}
    #p3-cinematic .busy .flood{display:block}
    #p3-cinematic .busy .character-idle,#p3-cinematic .paused .character-idle{animation-play-state:paused}
    #p3-cinematic .section{position:relative;height:100%;padding:143px 8% 105px;background:linear-gradient(105deg,#00172dee,#00233bbf 65%,#002e4833);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#00cffa55 #01182d}
    #p3-cinematic .section:before{content:'';position:absolute;right:-23%;top:-18%;width:70%;height:145%;background:#00d8ff12;transform:rotate(24deg);pointer-events:none}
    #p3-cinematic .section-label{font-size:11px;letter-spacing:5px;color:#8deeff;margin:0 0 17px}

    #p3-cinematic .section-body{position:relative;max-width:660px;font-size:16px;line-height:1.7;color:#cbeaf3}
    #p3-cinematic .section-body .lead{font-size:23px;line-height:1.4;color:white;max-width:600px;margin:28px 0 12px}
    #p3-cinematic .disciplines{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:30px;padding-top:19px;border-top:1px solid #43daf24d;font-size:12px;text-transform:uppercase;letter-spacing:2px}
    #p3-cinematic .back{position:relative;margin-top:36px;padding:15px 30px 15px 23px;background:var(--cyan);color:#00182d;font-size:14px;font-weight:900;font-style:italic;transform:skewX(-13deg);box-shadow:6px 7px 0 #000e21}
    #p3-cinematic .back span{display:block;transform:skewX(13deg)}
    #p3-cinematic .project-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}
    #p3-cinematic .project{margin:0}
    #p3-cinematic .project-art{height:128px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 35% 70%,#6c43ff,transparent 45%),linear-gradient(135deg,#00d0f8,#024770 42%,#031c3d);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
    #p3-cinematic .project-art:before{content:'';position:absolute;width:110px;height:110px;border:2px solid #cdfcff;box-shadow:0 0 30px #00d8ff,inset 0 0 20px #00d8ff;border-radius:50%;left:24%;top:10%;transform:rotateX(50deg) rotate(-25deg)}
    #p3-cinematic .project-art.second{background:linear-gradient(35deg,#00d6ff 28%,#f0feff 28% 36%,#05162e 36% 65%,#633ff0 65%)}
    #p3-cinematic .project-art.second:before{border-radius:0;transform:rotate(30deg);border-width:10px;box-shadow:none;left:45%;top:-35%}
    #p3-cinematic figcaption{font-size:13px;line-height:1.4;margin-top:9px;color:#fff}
    #p3-cinematic figcaption small{display:block;color:#a9dbe9;font-size:11px;margin-top:4px;letter-spacing:1px}
    #p3-cinematic .timeline{display:grid;gap:16px;padding:0;list-style:none;margin:23px 0 0}
    #p3-cinematic .timeline li{display:grid;grid-template-columns:37px 1fr;gap:17px;align-items:start;font-size:14px;line-height:1.5}
    #p3-cinematic .timeline b{font-size:24px;font-style:italic;color:var(--cyan)}
    #p3-cinematic .timeline strong{color:#fff;display:block;font-size:16px}
    #p3-cinematic .asset-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px;background:#021425;color:#b9d6e0;font-size:11px;line-height:1.5;letter-spacing:.4px}
    #p3-cinematic .asset-bar label{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#dffaff}
    #p3-cinematic .asset-bar input{width:210px;max-width:100%;font-size:11px;color:#b9d6e0}
    #p3-cinematic input::file-selector-button{background:#0b3149;color:#e4fcff;border:1px solid #27637b;padding:7px;margin-right:8px}
    #p3-cinematic .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @keyframes p3c-idle{0%{transform:translateY(0) rotate(.2deg) scale(1)}100%{transform:translateY(-8px) rotate(-.5deg) scale(1.008)}}

    #p3-cinematic .chrome{top:calc(25px + env(safe-area-inset-top));left:calc(28px + env(safe-area-inset-left));right:calc(28px + env(safe-area-inset-right))}
    #p3-cinematic .bottom{bottom:calc(24px + env(safe-area-inset-bottom));left:calc(28px + env(safe-area-inset-left));right:calc(28px + env(safe-area-inset-right))}
    #p3-cinematic:not([data-section="menu"]) .view{background:linear-gradient(105deg,#00172dee,#00233bbf 65%,#002e4833)}
    #p3-cinematic .section{position:absolute;top:calc(110px + env(safe-area-inset-top));bottom:calc(90px + env(safe-area-inset-bottom));left:0;right:0;height:auto;padding:33px 8% 35px;background:transparent}
    #p3-cinematic .player-host{position:absolute;z-index:25;right:calc(22px + env(safe-area-inset-right));top:calc(108px + env(safe-area-inset-top));width:58px}

  <script>
  (()=>{
    'use strict';
    const root=document.getElementById('p3-cinematic');
    if(!root||root.dataset.ready)return;root.dataset.ready='true';
    const $=s=>root.querySelector(s), stage=$('.stage'),view=$('.view'),water=$('.water'),particles=$('.particles'),flood=$('.flood');

    const contents={
      about:'<p class="lead">Diseño con intención.<br>Experiencias con personalidad.</p><p>Lo visual y lo interactivo comparten un mismo lenguaje: ritmo, contraste y movimiento. Este espacio reúne exploraciones donde una interfaz también puede contar una historia.</p><div class="disciplines"><span>Visual design</span><span>Creative development</span><span>Motion & interaction</span></div>',
      projects:'<p class="lead">Laboratorio visual</p><div class="project-grid"><figure class="project"><div class="project-art"></div><figcaption>01 — Under the surface<small>ESTUDIO PROCEDURAL / AGUA Y LUZ</small></figcaption></figure><figure class="project"><div class="project-art second"></div><figcaption>02 — A different angle<small>ESTUDIO VISUAL / TIPOGRAFÍA Y FORMA</small></figcaption></figure></div>',
      experience:'<p class="lead">Del concepto a la interacción.</p><ol class="timeline"><li><b>01</b><div><strong>Dirección visual</strong>Color, composición y tipografía con una identidad reconocible.</div></li><li><b>02</b><div><strong>Diseño de movimiento</strong>Transiciones que conectan las vistas y guían la atención.</div></li><li><b>03</b><div><strong>Desarrollo de interfaces</strong>Una experiencia que responde al ratón, al teclado y al tacto.</div></li></ol>',
      contact:'<p class="lead">Toda colaboración empieza<br>con una conversación.</p><p>Diseño visual, experiencias digitales y proyectos que se atrevan a tener una voz propia.</p><div class="disciplines"><span>Portfolio interactivo</span><span>Exploración creativa</span></div><p>Los canales de contacto se incorporarán cuando se definan los datos públicos del portafolio.</p>'
    };
    const saved=window.openai?.widgetState?.privateContent;

    let W=1,H=1,dpr=1,px=0,py=0,tx=0,ty=0,sprite=null,frameCount=2,frame=0,masks=[];
    let nextBlink=4,closeUntil=0,doublePending=false,secondBlink=false,portrait=null,bleed=null,bleedCtx=null,idle=null;
    const ctx=particles.getContext('2d'),fctx=flood.getContext('2d'),rippleCanvas=$('.ripples'),rippleCtx=rippleCanvas.getContext('2d');
    const ripples=[];let lastRipple=0;
    function addRipple(event,click=false){if(!motion()||busy||event.target.closest('.player-host'))return;const now=performance.now();if(!click&&now-lastRipple<170)return;lastRipple=now;const b=stage.getBoundingClientRect();ripples.push({x:(event.clientX-b.left)/b.width,y:(event.clientY-b.top)/b.height,start:time,power:click?1:.38});if(ripples.length>12)ripples.shift();requestDraw();}
    function drawRipples(){rippleCtx.clearRect(0,0,W,H);if(!motion()){ripples.length=0;return;}for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=time-r.start;if(age>1.6){ripples.splice(i,1);continue;}for(let k=0;k<3;k++){const radius=age*100-k*12;if(radius<=0)continue;rippleCtx.beginPath();rippleCtx.ellipse(r.x*W,r.y*H,radius,radius*.53,-.18,0,Math.PI*2);rippleCtx.strokeStyle=`rgba(166,247,255,${Math.max(0,(1-age/1.6)*r.power*.4)})`;rippleCtx.lineWidth=1.2;rippleCtx.stroke();}}}
    const audioSystem=createAudioSystem();
    const playerUnmount=mountPlayer(audioSystem);
    const motion=()=>!paused&&!reduce.matches;
    const save=()=>{try{const a=audioSystem.snapshot();window.openai?.setWidgetState?.({modelContent:{section:current,spriteFrames:frameCount,music:'Color Your Night'},privateContent:{section:current,selected,paused,audio:{sfx:a.sfx}}})?.catch(()=>{});}catch{}};

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'};
      const buffers={},voices=new Set(),listeners=new Set();
      let context=null,output=null,navVoice=null,unlocked=false,dead=false,sfxCount=0;
      let requested=true,playing=false,blocked=false,error=false,sfxEnabled=saved?.audio?.sfx!==false;
      function snapshot(){return{musicEnabled:requested,playing,blocked,error,sfx:sfxEnabled,status:error?'No se pudo cargar el MP3.':playing?'Música reproduciéndose':blocked?'Pulsa para activar la música':'Música lista'};}
      function emit(){if(dead)return;const state=snapshot();root.dataset.audioSfx=String(sfxCount);root.dataset.musicPlaying=String(playing);root.dataset.musicBlocked=String(blocked);listeners.forEach(fn=>fn(state));}
      function ensureSfx(){
        if(context)return;
        const AudioCtor=window.AudioContext||window.webkitAudioContext;
        if(!AudioCtor)return;
        context=new AudioCtor({latencyHint:'interactive'});
        output=context.createGain();output.gain.value=.9;output.connect(context.destination);
        for(const [name,encoded] of Object.entries(bytes)){
          try{
            const raw=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
            const data=new DataView(raw.buffer),count=(raw.length-44)/2,rate=data.getUint32(24,true);
            const buffer=context.createBuffer(1,count,rate),samples=buffer.getChannelData(0);
            let peak=0;
            for(let i=0;i<count;i++){const value=data.getInt16(44+i*2,true)/32768;samples[i]=value;peak=Math.max(peak,Math.abs(value));}
            const scale=Math.min(16,.82/Math.max(peak,.001));
            for(let i=0;i<count;i++)samples[i]*=scale;
            buffers[name]=buffer;
          }catch{}
        }
      }
      async function tryPlay(){if(dead||!requested||error)return false;try{await music.play();if(dead)return false;playing=!music.paused;blocked=false;emit();return playing;}catch{playing=false;blocked=true;emit();return false;}}
      async function unlock(){if(dead)return false;const attempt=requested&&!playing?tryPlay():Promise.resolve(playing);try{ensureSfx();if(context){await context.resume();unlocked=context.state==='running';}}catch{}await attempt;return playing;}
      function sfx(name){
        if(dead||!sfxEnabled||!context||!unlocked||!buffers[name])return;
        if(name==='move'&&navVoice){try{navVoice.stop();}catch{}}
        const now=context.currentTime,gain=context.createGain(),voice=context.createBufferSource();
        gain.gain.value=name==='move'?.65:name==='confirm'?.8:.82;
        gain.connect(output);voice.buffer=buffers[name];
        voice.playbackRate.value=name==='confirm'?4:name==='back'?.9:1;
        voice.connect(gain);voices.add(voice);
        if(name==='move')navVoice=voice;
        voice.onended=()=>{voices.delete(voice);voice.disconnect();gain.disconnect();if(navVoice===voice)navVoice=null;};
        voice.start(now);sfxCount++;root.dataset.audioSfx=String(sfxCount);
      }
      function toggle(){if(playing){requested=false;music.pause();playing=false;blocked=false;emit();save();return;}requested=true;tryPlay();save();}
      function toggleSfx(){sfxEnabled=!sfxEnabled;emit();save();}
      music.addEventListener('error',()=>{if(dead)return;error=true;playing=false;blocked=false;emit();});
      music.addEventListener('play',()=>{playing=true;blocked=false;emit();});
      music.addEventListener('pause',()=>{playing=false;emit();});
      music.load();queueMicrotask(tryPlay);
      return{snapshot,subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);},unlock,sfx,toggle,toggleSfx,dispose(){dead=true;music.pause();music.removeAttribute('src');music.load();for(const voice of voices){try{voice.stop();}catch{}}listeners.clear();context?.close().catch(()=>{});}};
    }
    function mountPlayer(engine){
      const host=$('.player-host');
      if(!window.React||!window.ReactDOM){host.innerHTML='<button class="dock-toggle" type="button" aria-label="Reproducir música">♫</button>';return()=>{};}
      const {createElement:h,useState,useEffect}=React;
      function Player(){const [state,setState]=useState(engine.snapshot());useEffect(()=>engine.subscribe(setState),[]);
        return h('button',{type:'button',className:'dock-toggle cursor-interaction'+(state.playing?' is-playing':''),'aria-label':state.playing?'Pausar música':'Reproducir música','aria-pressed':state.playing,title:state.status,onClick:engine.toggle},h('span',{'aria-hidden':true},state.playing?'♫':'♪'));
      }
      const reactRoot=ReactDOM.createRoot(host);reactRoot.render(h(Player));return()=>reactRoot.unmount();
    }
  })();
